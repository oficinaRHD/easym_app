<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso · EasyMarket</title>
  
  <!-- Font Awesome 6 (iconos) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* === VARIABLES Y RESET === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: #dbeafe;
      --accent: #7c3aed;
      --success: #10b981;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
      --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.05);
      --shadow-focus: 0 0 0 4px rgba(37, 99, 235, 0.15);
      --radius: 20px;
      --radius-sm: 12px;
      --transition: all 0.2s ease;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #f1f5f9 0%, #e6ecf5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--gray-700);
    }

    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap');

    /* === CONTENEDOR PRINCIPAL CON EFECTO GLASS === */
    .login-container {
      position: relative;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,0.8) inset;
      overflow: hidden;
      transition: box-shadow 0.3s ease;
    }

    .login-container.inactive {
      animation: pulseContainer 2s ease-in-out infinite;
    }

    @keyframes pulseContainer {
      0%, 100% { box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,0.8) inset; }
      50% { box-shadow: 0 20px 30px -5px rgba(37, 99, 235, 0.2), 0 0 0 1px rgba(255,255,255,0.8) inset; }
    }

    /* Timer bar */
    .timer-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent), #f97316);
      width: 100%;
      transform-origin: left;
      animation: timer 10s linear forwards;
      z-index: 10;
      border-radius: 0 0 4px 0;
    }

    @keyframes timer {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }

    /* Login Box */
    .login-box {
      padding: 2.8rem 2.5rem;
      text-align: center;
      position: relative;
      z-index: 2;
      background: transparent;
    }

    .login-box h2 {
      margin: 0 0 1.5rem;
      color: var(--gray-900);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .store-icon {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 4px 6px rgba(37,99,235,0.2));
    }

    .logo-link {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .logo-text-nav {
      font-size: 2rem;
      font-weight: 700;
    }

    .logo-highlight-nav {
      background: linear-gradient(135deg, var(--primary), #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* === CAMPOS DE TEXTO === */
    .input-wrapper {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .input-wrapper label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 0.5rem;
      color: var(--gray-600);
    }

    .input-icon-container {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-container i.icon-left {
      position: absolute;
      left: 16px;
      color: var(--gray-400);
      font-size: 1.1rem;
      z-index: 2;
    }

    .form-control {
      width: 100%;
      padding: 16px 16px 16px 48px;
      background-color: white;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 500;
      color: var(--gray-800);
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: var(--shadow-focus);
    }

    .toggle-password {
      position: absolute;
      right: 16px;
      color: var(--gray-400);
      font-size: 1.2rem;
      cursor: pointer;
      transition: var(--transition);
      z-index: 3;
      background: white;
      padding: 4px;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-password:hover {
      color: var(--primary);
      background-color: var(--primary-soft);
    }

    /* === OPCIONES === */
    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 1rem 0 2rem;
    }

    .checkbox-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gray-600);
      font-size: 0.95rem;
      cursor: pointer;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      border-radius: 4px;
      cursor: pointer;
    }

    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: var(--transition);
      border-bottom: 1px dashed transparent;
    }

    .forgot-link:hover {
      color: var(--primary-dark);
      border-bottom-color: var(--primary-soft);
    }

    /* === BOTÓN PRINCIPAL === */
    .btn-primary {
      width: 100%;
      padding: 16px 20px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 150%);
      color: white;
      border: none;
      border-radius: 40px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 8px 16px -6px rgba(37, 99, 235, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:hover {
      transform: scale(1.02) translateY(-2px);
      box-shadow: 0 14px 24px -8px rgba(37, 99, 235, 0.4);
    }

    /* === FOOTER === */
    .footer-links {
      margin-top: 2rem;
      font-size: 1rem;
      color: var(--gray-500);
    }

    .footer-links a {
      color: var(--gray-800);
      text-decoration: none;
      font-weight: 600;
      margin-left: 6px;
      transition: var(--transition);
      border-bottom: 2px solid transparent;
    }

    .footer-links a:hover {
      color: var(--primary);
      border-bottom-color: var(--primary-soft);
    }

    .brand-note {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--gray-400);
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    /* === MENSAJE DE NOTIFICACIÓN === */
    #login-message {
      display: none;
      padding: 14px 16px;
      margin-bottom: 20px;
      border-radius: 40px;
      font-size: 0.95rem;
      font-weight: 500;
      text-align: left;
      background: white;
      box-shadow: var(--shadow-sm);
      border-left: 4px solid transparent;
    }
    .msg-error {
      background-color: #fef2f2;
      border-left-color: #dc2626;
      color: #b91c1c;
    }
    .msg-success {
      background-color: #f0fdf4;
      border-left-color: var(--success);
      color: #166534;
    }

    /* === ACTIVITY BUTTON === */
    .activity-btn {
      text-align: center;
      padding: 10px 0 20px;
    }

    .activity-btn span {
      color: var(--primary);
      cursor: pointer;
      font-size: 14px;
      text-decoration: underline;
      opacity: 0.7;
      transition: opacity 0.3s;
    }

    .activity-btn span:hover {
      opacity: 1;
    }

    /* === OVERLAY DE INACTIVIDAD === */
    .inactivity-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease, visibility 0.5s;
      border-radius: var(--radius);
      padding: 20px;
    }

    .inactivity-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .animation-container {
      width: 200px;
      height: 200px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .inactivity-message {
      text-align: center;
      color: var(--gray-800);
    }

    .inactivity-message h3 {
      font-size: 24px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, var(--primary) 0%, #f97316 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .inactivity-message p {
      color: var(--gray-600);
      font-size: 16px;
      margin-bottom: 10px;
    }

    .inactivity-message small {
      display: block;
      margin: 15px 0;
      color: var(--gray-400);
      font-size: 14px;
    }

    .retry-btn {
      margin-top: 10px;
      padding: 12px 30px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 150%);
      color: white;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.3s;
      box-shadow: 0 8px 16px -6px rgba(37, 99, 235, 0.3);
    }

    .retry-btn:hover {
      transform: scale(1.05);
    }

    /* === RESPONSIVE === */
    @media (max-width: 480px) {
      .login-box {
        padding: 2rem 1.5rem;
      }
      .login-box h2 {
        font-size: 1.6rem;
      }
      .store-icon {
        width: 28px;
        height: 28px;
      }
      .animation-container {
        width: 150px;
        height: 150px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container" id="loginContainer">
    
    <!-- Timer bar -->
    <div class="timer-bar" id="timerBar"></div>
    
    <div class="login-box">
      <h2>
        <!-- SVG de tienda -->
        <svg class="store-icon" viewBox="0 0 33 33" fill="none" xmlns="http://www.w3.org/2000/svg">

          <defs>
            <linearGradient id="gradient-store" x1="0" y1="0" x2="33" y2="33" gradientUnits="userSpaceOnUse">
              <stop stop-color="#2563eb"/>
              <stop offset="1" stop-color="#f97316"/>
            </linearGradient>
          </defs>
        </svg>
        <span>Bienvenido a</span>
        <a href="/index.html" class="logo-link">
          <span class="logo-text-nav">Easy<span class="logo-highlight-nav">Market</span></span>
        </a>
      </h2>

      <!-- Contenedor de mensajes -->
      <div id="login-message"></div>

      <form id="loginFormStatic">
        <div class="input-wrapper">
          <label for="email">Correo electrónico</label>
          <div class="input-icon-container">
            <i class="fa-regular fa-envelope icon-left"></i>
            <input type="email" id="email" name="email" class="form-control" 
                   placeholder="tú@ejemplo.com" required autocomplete="username email">
          </div>
        </div>

        <div class="input-wrapper">
          <label for="password">Contraseña</label>
          <div class="input-icon-container">
            <i class="fa-solid fa-lock icon-left"></i>
            <input type="password" id="password" name="password" class="form-control" 
                   placeholder="··········" required autocomplete="current-password" minlength="6">
            <i class="fa-regular fa-eye toggle-password" id="togglePassword" title="Mostrar contraseña"></i>
          </div>
        </div>

        <div class="options-row">
          <label class="checkbox-group">
            <input type="checkbox" id="rememberMe" name="rememberMe" checked>
            <span>Recordar acceso</span>
          </label>
          <a href="forgot-password.html" class="forgot-link">¿Olvidaste tu clave?</a>
        </div>

        <button type="submit" class="btn-primary">
          <span>Iniciar sesión</span>
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </button>

        <div class="footer-links">
          <span>¿No tienes cuenta?</span>
          <a href="register.html">Crear cuenta nueva →</a>
        </div>

        <div class="brand-note">
          <i class="fa-regular fa-circle"></i> EasyMarket · compra fácil <i class="fa-regular fa-circle"></i>
        </div>
      </form>

      <!-- Botón para simular actividad -->
      <div class="activity-btn">
        <span onclick="resetInactivityTimer()">!</span>
      </div>
    </div>

    <!-- Overlay de inactividad -->
    <div class="inactivity-overlay" id="inactivityOverlay">
      <div class="animation-container">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <circle cx="100" cy="100" r="80" fill="url(#grad1)">
            <animate attributeName="r" values="80;85;80" dur="3s" repeatCount="indefinite" />
          </circle>
          
          <defs>
            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2563eb">
                <animate attributeName="stop-color" values="#2563eb;#7c3aed;#2563eb" dur="3s" repeatCount="indefinite" />
              </stop>
              <stop offset="100%" stop-color="#f97316">
                <animate attributeName="stop-color" values="#f97316;#2563eb;#f97316" dur="3s" repeatCount="indefinite" />
              </stop>
            </linearGradient>
          </defs>
          
          <line x1="60" y1="80" x2="80" y2="80" stroke="white" stroke-width="4" stroke-linecap="round">
            <animate attributeName="x2" values="80;70;80" dur="2s" repeatCount="indefinite" />
          </line>
          <line x1="120" y1="80" x2="140" y2="80" stroke="white" stroke-width="4" stroke-linecap="round">
            <animate attributeName="x2" values="140;130;140" dur="2s" repeatCount="indefinite" />
          </line>
          
          <text x="100" y="130" text-anchor="middle" fill="white" font-size="20" font-weight="bold">
            Z
            <animate attributeName="opacity" values="1;0.5;0" dur="2s" repeatCount="indefinite" />
            <animateMotion path="M 0 0 L 20 -20" dur="2s" repeatCount="indefinite" />
          </text>
          <text x="120" y="110" text-anchor="middle" fill="white" font-size="16" font-weight="bold">
            Z
            <animate attributeName="opacity" values="1;0.5;0" dur="2s" begin="0.5s" repeatCount="indefinite" />
            <animateMotion path="M 0 0 L 20 -20" dur="2s" begin="0.5s" repeatCount="indefinite" />
          </text>
          <text x="140" y="90" text-anchor="middle" fill="white" font-size="12" font-weight="bold">
            Z
            <animate attributeName="opacity" values="1;0.5;0" dur="2s" begin="1s" repeatCount="indefinite" />
            <animateMotion path="M 0 0 L 20 -20" dur="2s" begin="1s" repeatCount="indefinite" />
          </text>
          
          <path d="M100 160 Q130 130 150 150 Q170 170 140 190 Q120 210 100 200 Q80 210 60 190 Q30 170 50 150 Q70 130 100 160" fill="white" opacity="0.8">
            <animate attributeName="d" values="M100 160 Q130 130 150 150 Q170 170 140 190 Q120 210 100 200 Q80 210 60 190 Q30 170 50 150 Q70 130 100 160; M100 155 Q130 125 150 145 Q170 165 140 185 Q120 205 100 195 Q80 205 60 185 Q30 165 50 145 Q70 125 100 155; M100 160 Q130 130 150 150 Q170 170 140 190 Q120 210 100 200 Q80 210 60 190 Q30 170 50 150 Q70 130 100 160" dur="2s" repeatCount="indefinite" />
          </path>
        </svg>
      </div>
      
      <div class="inactivity-message">
        <h3>¿Sigues ahí? <i class="fa fa-hand-paper-o" style="font-size:48px;color:red"></i></h3>
        <p>Te hemos echado de menos</p>
        <small>Haz clic en cualquier parte para continuar</small>
        <button class="retry-btn" onclick="resetInactivityTimer()">¡Estoy aquí!</button>
      </div>
    </div>
  </div>
  
  <script type='module' src="js/login.js?v=0055"></script>
  <script src="js/animate.js?v=002"></script>
</body>
</html>
