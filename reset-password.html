<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Restablecer Contraseña</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .reset-container {
      max-width: 400px;
      margin: 60px auto;
      padding: 20px;
      border-radius: 8px;
      background: #f9f9f9;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .reset-container h2 {
      margin-bottom: 20px;
    }
    .reset-container input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .reset-container button {
      width: 100%;
      padding: 12px;
      background: #28a745;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .reset-container button:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <div class="reset-container">
    <h2>Restablecer Contraseña</h2>
    <form id="resetForm">
      <input type="password" id="newPassword" placeholder="Nueva contraseña" required>
      <button type="submit">Guardar Contraseña</button>
    </form>
  </div>

  <script type="module" src="/js/reset.js"></script>
</body>
</html>
