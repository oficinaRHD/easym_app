<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando Libro... | Reader+</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --bg: #0b0f1a;
            --card: #161b2c;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --gold: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* --- Barra de Navegación --- */
        .navbar {
            position: fixed; top: 0; width: 100%; height: 70px;
            background: rgba(11, 15, 26, 0.8); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }
        .nav-content { width: 100%; max-width: 1100px; padding: 0 2rem; display: flex; justify-content: space-between; }
        .nav-links { display: flex; gap: 1.5rem; }
        .nav-item { 
            color: var(--text); text-decoration: none; font-weight: 600; 
            font-size: 0.9rem; transition: 0.3s; display: flex; align-items: center; gap: 8px;
        }
        .nav-item:hover { color: var(--accent); }

        /* --- Hero Section --- */
        .hero {
            position: relative; 
            min-height: 500px; 
            padding: 120px 2rem 60px;
            display: flex; 
            justify-content: center; 
            align-items: center;
            overflow: hidden; 
        }
            
        .hero-blur {
            position: absolute; inset: 0; 
            background-size: cover;
            background-position: center;
            filter: blur(60px) brightness(0.2); z-index: -1; transform: scale(1.2);
            transition: background-image 0.5s ease;
        }

        .hero-container {
            max-width: 1000px; width: 100%; display: grid; 
            grid-template-columns: 280px 1fr; gap: 3rem; align-items: start;
        }

        .cover-wrapper { position: relative; }
        .main-cover {
            width: 100%; aspect-ratio: 2/3; border-radius: 20px;
            object-fit: cover; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .info h1 { font-size: 3rem; font-weight: 800; line-height: 1.1; margin-bottom: 1rem; }
        .author { font-size: 1.2rem; color: var(--accent); font-weight: 600; margin-bottom: 1.5rem; }

        .stats { display: flex; gap: 2rem; margin-bottom: 2rem; }
        .stat-box { display: flex; flex-direction: column; }
        .stat-num { font-size: 1.5rem; font-weight: 800; }
        .stat-desc { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }

        /* --- Botón y Progreso --- */
        .action-area { display: flex; flex-direction: column; gap: 1rem; }
        .btn-main {
            background: var(--accent); color: white; padding: 0.8rem 2rem;
            border-radius: 10px; text-decoration: none; font-weight: 600;
            display: inline-flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: 0 10px 20px var(--accent-glow); transition: 0.3s; width: fit-content;
            border: none; cursor: pointer;
        }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 15px 25px var(--accent-glow); }
        
        .progress-container { width: 100%; max-width: 300px; background: rgba(255,255,255,0.1); height: 6px; border-radius: 10px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 1s ease; }

        .btn-follow {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; padding: 0.8rem 1.5rem; border-radius: 50px;
            cursor: pointer; font-weight: 600; transition: 0.3s;
            display: inline-flex; align-items: center; gap: 8px; width: fit-content;
        }
        .btn-follow.active { background: #ef4444; border-color: #ef4444; }

        /* --- Contenido Principal --- */
        .main-grid { max-width: 1000px; margin: 0 auto 5rem; padding: 0 1rem; display: grid; gap: 2rem; }
        .card { background: var(--card); padding: 2.5rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.03); }
        .card-title { font-size: 1.4rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px; }
        .card-title::before { content: ''; width: 5px; height: 25px; background: var(--accent); border-radius: 4px; }

        .chapter-grid { display: grid; gap: 0.8rem; }
        .chapter-card {
            background: rgba(255,255,255,0.03); padding: 1.2rem 1.5rem; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center;
            text-decoration: none; color: var(--text); transition: 0.2s;
        }
        .chapter-card:hover { background: rgba(255,255,255,0.08); transform: translateX(8px); }
        .ch-num { color: var(--accent); font-weight: 800; margin-right: 10px; }

        /* --- Relacionados scroll horizontal --- */
        .author-list {
            display: flex; gap: 15px; overflow-x: auto; scroll-snap-type: x mandatory;
            padding-bottom: 10px; scrollbar-width: none;
        }
        .author-list::-webkit-scrollbar { display: none; }
        .author-item {
            flex: 0 0 85%; scroll-snap-align: center; display: flex; align-items: center;
            gap: 15px; text-decoration: none; background: rgba(255, 255, 255, 0.03);
            padding: 10px; border-radius: 16px; transition: 0.3s;
        }
        .author-item img { width: 85px; aspect-ratio: 1/1.2; object-fit: cover; border-radius: 8px; }

        /* --- Estrellas --- */
        .rating-stars { display: flex; flex-direction: row-reverse; gap: 5px; justify-content: center; }
        .rating-stars input { display: none; }
        .rating-stars label { font-size: 2.5rem; color: #334155; cursor: pointer; transition: 0.2s; }
        .rating-stars label:hover, .rating-stars label:hover ~ label, .rating-stars input:checked ~ label { color: var(--gold); }

        @media (max-width: 850px) {
            .hero-container { grid-template-columns: 1fr; text-align: center; justify-items: center; }
            .info h1 { font-size: 2.2rem; }
            .stats { justify-content: center; }
            .action-area { align-items: center; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-content">
            <a href="libros.html" style="text-decoration: none; color: var(--accent); font-weight: 800; font-size: 1.4rem;">READER+</a>
            <div class="nav-links">
                <a href="libros.html" class="nav-item">Explorar</a>
                <a href="biblioteca.html" class="nav-item">Favoritos</a>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-blur" id="bg-blur"></div>
        <div class="hero-container">
            <div class="cover-wrapper">
                <img src="" id="main-portada" class="main-cover" alt="Portada">
            </div>
            <div class="info">
                <h1 id="libro-titulo">Cargando...</h1>
                <p class="author" id="libro-autor"></p>
                
                <div class="stats">
                    <div class="stat-box">
                        <span class="stat-num" id="stat-promedio">⭐ 0.0</span>
                        <span class="stat-desc" id="stat-votos">0 Reseñas</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-num" id="stat-capitulos">0</span>
                        <span class="stat-desc">Capítulos</span>
                    </div>
                </div>

                <div class="action-area" id="area-lectura">
                    </div> 
            </div>
        </div>
    </header>

    <main class="main-grid">
        <section class="card">
            <h2 class="card-title">Sinopsis</h2>
            <p id="libro-sinopsis" style="color: var(--text-muted); font-size: 1.1rem; white-space: pre-line;"></p>
        </section>

        <section class="card">
            <h2 class="card-title">Índice de Capítulos</h2>
            <div class="chapter-grid" id="lista-capitulos">
                </div>
        </section>

        <section class="card author-section" id="section-relacionados" style="display: none;">
            <h2 class="card-title">Más de este autor</h2>
            <div class="author-list" id="lista-relacionados">
                </div>
        </section>

        <section class="card">
            <h2 class="card-title">Tu opinión cuenta</h2>
            <div id="area-valoracion">
                </div>
        </section>
    </main>

    <script type="module" src="js/libro-detalle.js"></script>

</body>
</html>
