<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Recuperar Contraseña</title>
  <style>
    .forgot-container {
      max-width: 400px;
      margin: 60px auto;
      padding: 20px;
      border-radius: 8px;
      background: #f9f9f9;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .forgot-container h2 {
      margin-bottom: 20px;
    }
    .forgot-container input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .forgot-container button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .forgot-container button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="forgot-container">
    <h2>¿Olvidaste tu contraseña?</h2>
    <p>Introduce tu correo electrónico y te enviaremos un enlace para restablecerla.</p>
    <form id="forgotForm">
      <input type="email" id="email" placeholder="Tu correo electrónico" required>
      <button type="submit">Enviar enlace</button>
    </form>
  </div>

  <script type="module" src="/js/forgot.js"></script>
</body>
</html>
