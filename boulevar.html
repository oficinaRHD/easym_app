<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Boulevard - EasyMarkets</title>

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Estilos del bottom-nav -->
    <link rel="stylesheet" href="/css/global_btn_nav.css">
    <link rel="stylesheet" href="/css/boulevar-fixes.css">

    <!-- Estilos específicos de Boulevar -->
    <link rel="stylesheet" href="/css/frist_view.css">
    <link rel="stylesheet" href="/css/view-mode-boulevard.css">
    <link rel="stylesheet" href="/css/boulevar.css">
    <link rel="stylesheet" href="/css/boulevar-filter-modal.css">

    <style>

        /* Para compatibilidad máxima */
html {
    -webkit-tap-highlight-color: transparent;
    -webkit-tap-highlight-color: rgba(0,0,0,0); /* Alternativa transparente */
}
        /* Ajustes adicionales para coherencia */
        body {
            background: #f5f7fa;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .body-content {
            max-width: 1280px;
            margin: 0 auto;
           
        }

        @media (max-width: 768px) {
            .body-content {
               
            }
        }

        /* Ocultar elementos que ya no necesitamos en la barra superior */
        .dashboard-header .search-wrapper,
        .dashboard-header .view-selector-compact {
            display: none;
        }

        /* Rediseño del selector de tiendas */
        .store-selector-container select {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1a1f36;
        }

        /* Botón de filtros mejorado */
        .filter-trigger {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-trigger:hover {
            background: #f1f5f9;
            border-color: #ff6b4a;
            color: #ff6b4a;
        }

        .filter-trigger.active {
            background: #ff6b4a;
            border-color: #ff6b4a;
            color: white;
        }

        /* Panel de filtros */
        .filter-panel {
            background: white;
            border-radius: 20px;
            margin-top: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            border: 1px solid #eef2f8;
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
        }

        .filter-row select {
            flex: 1;
            min-width: 150px;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            background: #f8fafc;
            font-size: 0.85rem;
        }

        .filter-actions {
            display: flex;
            gap: 8px;
        }

        .btn-apply,
        .btn-clear {
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-apply {
            background: #ff6b4a;
            color: white;
        }

        .btn-apply:hover {
            background: #e55a3b;
        }

        .btn-clear {
            background: #f1f5f9;
            color: #475569;
        }

        .btn-clear:hover {
            background: #e2e8f0;
        }

        .hidden {
            display: none !important;
        }

        /* Mensaje de hint */
        .explore-hint {
            position: fixed;
            bottom: 100px;
            right: 20px;
            z-index: 300;
            max-width: 320px;
            transform: translateX(120%);
            transition: transform 0.3s ease;
        }

        .explore-hint.show {
            transform: translateX(0);
        }

        .hint-content {
            background: white;
            border-radius: 20px;
            padding: 16px 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            border: 1px solid #eef2f8;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hint-content i {
            color: #ff6b4a;
            font-size: 1.5rem;
        }

        .hint-close {
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            font-size: 1rem;
        }
    </style>
</head>

<body>

    <div id="toast-container"></div>

    <!-- NUEVO HEADER MODERNIZADO -->





    <main class="body-content">

            <!-- Input de búsqueda oculto (se muestra al hacer clic en lupa) -->
    <div id="search-container"
        style="display: none; padding: 12px 20px; background: white; border-bottom: 1px solid #eef2f8;">
        <div style="max-width: 1280px; margin: 0 auto;">
            <input type="text" id="local-search" placeholder="Buscar productos por nombre, categoría, precio..."
                style="width: 100%; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 40px; font-size: 0.9rem;">
        </div>
    </div>
        <!-- Vista de Tienda Seleccionada -->
        <div id="tienda-info-header" class="tienda-info-header hidden">
            <div class="tienda-banner" id="tienda-banner">
                <div class="tienda-logo-container">
                    <img id="tienda-logo" src="/img/placeholders.png" alt="Logo" class="tienda-logo">
                </div>
            </div>
            <div class="tienda-datos">
                <div class="tienda-info">
                    <h2 id="tienda-nombre">Nombre Tienda</h2>
                    <p id="tienda-descripcion" class="tienda-descripcion"></p>
                    <p id="tienda-horario" class="tienda-horario">
                        <i class="fa-regular fa-clock"></i>
                        <span class="horario-texto"></span>
                    </p>
                    <div class="tienda-contacto">
                        <span id="tienda-ugps" class="contacto-item" style="display: none;">
                            <i class="fa-solid fa-location-dot"></i> Dirección
                        </span>
                        <span id="tienda-whatsapp" class="contacto-item" style="display: none;">
                            <i class="fa-brands fa-whatsapp"></i> WhatsApp
                        </span>
                        <span id="tienda-telegram" class="contacto-item" style="display: none;">
                            <i class="fa-brands fa-telegram"></i> Telegram
                        </span>
                        <span id="tienda-telefono" class="contacto-item" style="display: none;">
                            <i class="fa fa-phone"></i> Llamar
                        </span>
                    </div>
                    <div class="tienda-actions">
                        <button id="btn-agregar-favorita" class="btn-favorita">
                            <i class="fa-regular fa-star"></i> Agregar
                        </button>
                        <button id="btn-quitar-favorita" class="btn-favorita" style="display: none;">
                            <i class="fa-solid fa-star"></i> Quitar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Grid de Productos -->
        <div class="productos-container view-mode-full" id="products-grid">
            <div class="mensaje-inicial">
                <i class="fa-solid fa-store"></i>
                <h3>Selecciona una tienda</h3>
                <p>Usa el selector de favoritos para ver productos</p>
            </div>
        </div>
    </main>

    <!-- Mensaje flotante para primera visita -->
    <div id="exploreHint" class="explore-hint">
        <div class="hint-content">
            <i class="fa fa-store"></i>
            <span>Explora tiendas, descubre productos y agrega a favoritos</span>
            <button class="hint-close"><i class="fa fa-times"></i></button>
        </div>
        <div class="hint-arrow"></div>
    </div>

    <!-- Modal de filtrado en boulevar -->
    <div id="filterModal" class="stores-modal">
        <div class="stores-modal-header">
            <h3>
                <i class="fas fa-fire"></i>
                Filtrar productos
            </h3>
            <button class="stores-modal-close" id="closefilterModal">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="stores-modal-content" id="filterProductGrid">
            <!-- Las categorías se insertarán dinámicamente desde JS -->
        </div>
    </div>

    <!-- BOTTOM NAV CUSTOMIZADO PARA BOULEVAR -->
    <!-- Primero cargar Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Luego el componente (que ahora importa supabase como módulo) -->
    <script type="module" src="/js/bottom-nav-boulevar.js"></script>
    <bottom-nav-boulevar></bottom-nav-boulevar>

    <!-- Después los demás scripts -->
    <script type="module" src="js/boulevar.js?v=1.2"></script>
    <script src="js/frist_view_boulevar.js?v=1.0"></script>
    <script type="module" src="js/product-modal-boulevar.js"></script>
    <script src="/js/filters-boulevar.js"></script>
    <script>
        // Scroll behavior para ocultar header móvil
        let lastScrollY = window.scrollY;
        const mobileHeader = document.getElementById('boulevarMobileHeader');

        function handleScroll() {
            if (window.innerWidth <= 768) {
                const currentScrollY = window.scrollY;
                if (currentScrollY > lastScrollY && currentScrollY > 80) {
                    //mobileHeader.classList.add('boulevar-header-hidden');
                } else if (currentScrollY < lastScrollY) {
                    //mobileHeader.classList.remove('boulevar-header-hidden');
                }
                lastScrollY = currentScrollY;
            }
        }

        window.addEventListener('scroll', handleScroll);

        // Mostrar/ocultar buscador
        const searchBtnDesktop = document.getElementById('searchBtnDesktop');
        const searchBtnMobile = document.getElementById('searchBtnMobile');
        const searchContainer = document.getElementById('search-container');
        const searchInput = document.getElementById('local-search');

        function toggleSearch() {
            if (searchContainer.style.display === 'none') {
                searchContainer.style.display = 'block';
                searchInput?.focus();
            } else {
                searchContainer.style.display = 'none';
            }
        }

        searchBtnDesktop?.addEventListener('click', toggleSearch);
        searchBtnMobile?.addEventListener('click', toggleSearch);

        // Navegación usuario
        document.getElementById('userBtnDesktop')?.addEventListener('click', () => {
            window.location.href = 't-c.html';
        });
        document.getElementById('userBtnMobile')?.addEventListener('click', () => {
            window.location.href = 't-c.html';
        });

        // Sincronizar selectores de tiendas
        const selectDesktop = document.getElementById('tiendas-favoritas-select');
        const selectMobile = document.getElementById('tiendas-favoritas-select-mobile');

        if (selectDesktop && selectMobile) {
            selectDesktop.addEventListener('change', (e) => {
                selectMobile.value = e.target.value;
            });
            selectMobile.addEventListener('change', (e) => {
                selectDesktop.value = e.target.value;
            });
        }

        // Sincronizar botones de vista
        const viewBtns = document.querySelectorAll('.boulevar-view-btn');
        viewBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const view = btn.dataset.view;
                viewBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Disparar evento para que boulevar.js maneje el cambio de vista
                window.dispatchEvent(new CustomEvent('changeView', { detail: { view } }));
            });
        });

        // Hint de primera visita
        function hideHint() {
            const hint = document.getElementById('exploreHint');
            hint.style.animation = 'slideOutRight 0.3s ease-out forwards';
            setTimeout(() => {
                hint.classList.remove('show');
            }, 300);
        }

        const hasSeenHint = localStorage.getItem('boulevard_hint_seen');
        if (!hasSeenHint) {
            setTimeout(() => {
                const hint = document.getElementById('exploreHint');
                hint.classList.add('show');
            }, 1000);
            setTimeout(hideHint, 8000);
            localStorage.setItem('boulevard_hint_seen', 'true');
        }

        document.querySelector('.hint-close')?.addEventListener('click', hideHint);
    </script>
</body>

</html>
