<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Producto - EasyMarket</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .campo-imagen {
            background-color: #f8f9fa; color: #007bff; font-weight: bold;
            display: flex; align-items: center; gap: 6px; text-decoration: none;
            font-size: 1.5rem; font-family: 'cursive'; margin-left: 10px;
            background: transparent; border: transparent; margin-bottom: 20px;
        }
        .title-testo { font-weight: normal; color: #343a40; text-decoration: none; margin-left: 10px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .img-preview-box {
            width: 100%; height: 250px; border: 2px dashed #ced4da; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            background: #fff; overflow: hidden; position: relative; cursor: pointer;
        }
        .img-preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .btn-submit { padding: 12px 40px; font-size: 1.1rem; border-radius: 30px; font-weight: 600; box-shadow: 0 4px 6px rgba(40, 167, 69, 0.3); }
        .loading-spinner { display: none; margin-right: 8px; }
        
        /* Estilos del Modal del Editor de Imagen */
        #custom-image-editor {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 9999; backdrop-filter: blur(5px);
        }
        .editor-modal-content {
            width: 90%; max-width: 700px; margin: 5vh auto; background: #fff;
            padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
        }
        .cropper-container-wrapper { width: 100%; height: 60vh; margin-bottom: 20px; background: #eee; }
        #cropper-image { max-width: 100%; max-height: 100%; display: block; }
    </style>
</head>

<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                
                <h2 class="text-center mb-4 font-weight-bold text-dark" id="form-title">
                    <i class="fas fa-plus-circle text-success"></i> Nuevo Producto
                </h2>

                <form id="productForm">
                    <input type="hidden" id="productId" name="ProductoId">
                    <input type="hidden" id="UrlImagenOriginal" name="UrlImagenOriginal">

                    <div class="card p-4">
                       <span class="input-group-text campo-imagen"><i class="fas fa-image"></i> <a class="title-testo">Imagen del producto</a></span>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="font-weight-bold">Fuente de la imagen:</label>
                                    <div class="btn-group btn-group-toggle w-100 mb-3" data-toggle="buttons">
                                        <label class="btn btn-outline-primary active" id="btn-local">
                                            <input type="radio" name="imagen_opcion" value="archivo" checked> <i class="fas fa-upload"></i> Subir
                                        </label>
                                        <label class="btn btn-outline-primary" id="btn-url">
                                            <input type="radio" name="imagen_opcion" value="url"> <i class="fas fa-link"></i> URL
                                        </label>
                                    </div>

                                    <div id="input-archivo-container">
                                        <input type="file" id="Imagen" class="form-control-file" accept="image/*" style="display:none;" />
                                        <button type="button" class="btn btn-light border w-100 py-3" onclick="document.getElementById('Imagen').click()">
                                            Seleccionar archivo (Máx 2MB)
                                        </button>
                                    </div>

                                    <div id="input-url-container" style="display:none;">
                                        <input type="url" id="ImagenUrl" class="form-control" placeholder="https://ejemplo.com/imagen.jpg">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="img-preview-box" id="preview-container">
                                    <div class="text-muted text-center" id="placeholder-text">
                                        <i class="fas fa-image fa-3x mb-2"></i><br>Sin imagen
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card p-4">
                        <span class="campo-imagen"><i class="fas fa-info-circle"></i> <a class="title-testo">Información básica</a></span>
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label for="Nombre">Nombre del producto <span class="text-danger">*</span></label>
                                <input type="text" name="Nombre" id="Nombre" class="form-control" required placeholder="Ej: Zapatos deportivos Nike">
                            </div>

                            <div class="col-md-6 form-group">
                                <label for="Categoria">Categoría <span class="text-danger">*</span></label>
                                <select name="Categoria" id="Categoria" class="form-control" required>
                                    <option value="">Selecciona una categoría</option>
                                    <option value="Alimentos">Alimentos</option>
                                    <option value="Electrónica">Electrónica</option>
                                    <option value="Ropa y Accesorios">Ropa y Accesorios</option>
                                    <option value="Calzado">Calzado</option>
                                    <option value="Hogar y Cocina">Hogar y Cocina</option>
                                    <option value="Belleza y Cuidado Personal">Belleza y Cuidado Personal</option>
                                    <option value="Salud y Bienestar">Salud y Bienestar</option>
                                    <option value="Juguetes y Juegos">Juguetes y Juegos</option>
                                    <option value="Deportes y Aire Libre">Deportes y Aire Libre</option>
                                    <option value="Automotriz">Automotriz</option>
                                    <option value="Electrodomésticos">Electrodomésticos</option>
                                    <option value="Libros y Papelería">Libros y Papelería</option>
                                    <option value="Mascotas">Mascotas</option>
                                    <option value="Herramientas y Ferretería">Herramientas y Ferretería</option>
                                    <option value="Arte y Manualidades">Arte y Manualidades</option>
                                    <option value="Tecnología y Gadgets">Tecnología y Gadgets</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label for="Subcategoria">Subcategoría</label>
                                <select name="SubcategoriaId" id="Subcategoria" class="form-control">
                                    <option value="">Selecciona categoría primero...</option>
                                </select>
                            </div>
                            <div class="col-md-6 form-group">
                                <label for="Marca">Marca</label>
                                   <div class="input-group">
                                    <div class="input-group-prepend"><span class="input-group-text"><i class="fas fa-tag"></i></span></div>
                                <input type="text" name="Marca" id="Marca" class="form-control">
                                   </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="Descripcion">Descripción</label>
                            <textarea name="Descripcion" id="Descripcion" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="Promotion">Texto de Promoción (Opcional)</label>
                                  <div class="input-group">
                                <div class="input-group-prepend"><span class="input-group-text"><i class="fas fa-bullhorn"></i></span></div>
                            <input type="text" name="Promotion" id="Promotion" class="form-control" placeholder="Ej: ¡Oferta por tiempo limitado!">
                                  </div>
                        </div>
                    </div>

                    <div class="card p-4" id="card-atributos" style="display:none;">
                        <h4>Especificaciones</h4>
                        <div id="atributos-container" class="row"></div>
                    </div>

                    <div class="card p-4">
                        <span class="input-group-text campo-imagen"><i class="fas fa-dollar-sign"></i> <a class="title-testo">Precio y venta</a></span>
                        <div class="row">
                            <div class="col-md-4 form-group">
                                <label for="Precio">Precio</label>
                                <div class="input-group">
                                    <div class="input-group-prepend"><span class="input-group-text">$</span></div>
                                <input type="number" step="0.01" min="0" name="Precio" id="Precio" class="form-control font-weight-bold" required>
                                </div>
                            </div>
                            <div class="col-md-4 form-group">
                                <label for="Moneda">Moneda</label>
                                <select name="Moneda" id="Moneda" class="form-control">
                                    <option value="CUP">CUP</option>
                                    <option value="MLC">MLC</option>
                                    <option value="USD">USD</option>
                                </select>
                            </div>
                            <div class="col-md-4 form-group">
                                <label for="Estado">Condición</label>
                                <select name="Estado" id="Estado" class="form-control">
                                    <option value="Nuevo">Nuevo</option>
                                    <option value="Usado">Usado</option>
                                </select>
                            </div>

                            <div class="col-md-4 form-group">
                                <label for="Estado">Método de Pago</label>
                                <select name="Mpago" id="Mpago" class="form-control">
                                    <option value="Efectivo y Transferencia">Efectivo y Transferencia</option>
                                    <option value="Efectivo">Efectivo</option>
                                    <option value="Transferencia">Transferencia</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="card p-4">
                        <span class="input-group-text campo-imagen"><i class="fas fa-map-marker-alt"></i> <a class="title-testo">Ubicación y Contacto</a>
                                <!-- AGREGAR ESTE ÍCONO -->
        <button type="button" id="btn-aplicar-plantilla" class="btn btn-sm btn-outline-info ml-auto" title="Aplicar plantilla guardada">
            <i class="fas fa-clipboard-list"></i> Plantilla
        </button>

                        </span>
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label>Provincia</label>
                                <select name="Provincia" id="Provincia" class="form-control" required>
                                    <option value="">Selecciona...</option>
                                    <option value="Pinar del Río">Pinar del Río</option>
                                    <option value="Artemisa">Artemisa</option>
                                    <option value="La Habana">La Habana</option>
                                    <option value="Mayabeque">Mayabeque</option>
                                    <option value="Matanzas">Matanzas</option>
                                    <option value="Cienfuegos">Cienfuegos</option>
                                    <option value="Villa Clara">Villa Clara</option>
                                    <option value="Sancti Spíritus">Sancti Spíritus</option>
                                    <option value="Ciego de Ávila">Ciego de Ávila</option>
                                    <option value="Camagüey">Camagüey</option>
                                    <option value="Las Tunas">Las Tunas</option>
                                    <option value="Holguín">Holguín</option>
                                    <option value="Granma">Granma</option>
                                    <option value="Santiago de Cuba">Santiago de Cuba</option>
                                    <option value="Guantánamo">Guantánamo</option>
                                    <option value="Isla de la Juventud">Isla de la Juventud</option>
                                </select>
                            </div>
                            <div class="col-md-6 form-group">
                                <label>Entrega</label>
                                <select name="Entrega" id="Entrega" class="form-control">
                                    <option value="Personal">Recogida Personal</option>
                                    <option value="Domicilio">Envío a Domicilio</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label><i class="fas fa-phone"></i> Teléfono</label>
                                <input type="tel" name="Telefono" id="Telefono" class="form-control" placeholder="+53 5xxxxxxx">
                            </div>
                            <div class="col-md-6 form-group">
                                <label><i class="fab fa-telegram"></i> Telegram</label>
                                <input type="text" name="Telegram" id="Telegram" class="form-control" placeholder="@usuario">
                            </div>
                                  <div class="col-md-6 form-group">
                                <label><i class="fas fa-map-marker-alt"></i> Ubicación GPS </label>
                                <input type="text" name="Ugps" id="Ugps" class="form-control" placeholder="Plus Code Google Maps">
                                  </div>
                        </div>
                    </div>

                    <div class="text-center pb-5">
                        <button type="submit" class="btn btn-success btn-submit" id="submitBtn">
                            <i class="fas fa-spinner fa-spin loading-spinner"></i>
                            <span id="btnText">Publicar Ahora</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="custom-image-editor">
        <div class="editor-modal-content">
            <h4 class="mb-3">Ajustar Imagen</h4>
            <div class="cropper-container-wrapper">
                <img id="cropper-image" src="" alt="Edición">
            </div>
            <div class="d-flex justify-content-end align-items-center mt-3">
                <button type="button" id="btn-cancel-crop" class="btn btn-secondary mr-2">Cancelar</button>
                <button type="button" id="btn-save-crop" class="btn btn-primary"><i class="fas fa-crop-alt"></i> Guardar Recorte</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <script type="module">
        import { supabase } from './js/supabase.js';
        window.supabase = supabase; 
    </script>

    <script type="module" src="/js/render-subcategorias.js"></script>  
    <script type="module" src="/js/producto-form-logic.js"></script>
    <script type="module" src="/js/actions-new-product.js"></script>
</body>
</html>
