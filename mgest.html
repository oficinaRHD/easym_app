<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Gestor - Panel Maestro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --success-dark: #059669;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        .view-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            animation: slideDown 0.3s ease;
        }

        .view-header h2 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .view-header i {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Botones */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-secondary:hover {
            background: var(--bg);
            border-color: var(--primary);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-danger:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        /* Empty State */
        .hero-setup {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s ease;
        }

        .setup-card {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 24px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            max-width: 500px;
        }

        .setup-card i {
            font-size: 4rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .setup-card h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .setup-card p {
            color: var(--text-light);
            margin-bottom: 1.5rem;
        }

        /* Grid de tiendas */
        .tiendas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            animation: fadeIn 0.3s ease;
        }

        /* Card de tienda */
        .tienda-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .tienda-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .tienda-card:hover::before {
            transform: scaleX(1);
        }

        .tienda-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        /* Header de la card */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .tienda-nombre {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .edit-name-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-light);
            font-size: 0.75rem;
            transition: color 0.2s;
            padding: 0.25rem;
        }

        .edit-name-btn:hover {
            color: var(--primary);
        }

        .tienda-id {
            font-size: 0.7rem;
            color: var(--text-light);
            font-family: monospace;
            margin-bottom: 1rem;
            background: var(--bg);
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            display: inline-block;
        }

        /* Estadísticas */
        .tienda-stats {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
            padding: 0.75rem;
            background: var(--bg);
            border-radius: 12px;
        }

        .stat-item {
            flex: 1;
            text-align: center;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-light);
        }

        /* Permisos */
        .permisos-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .permisos-badge {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .p-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text-light);
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .p-icon.active {
            background: linear-gradient(135deg, var(--success) 0%, var(--success-dark) 100%);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-manage {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-manage:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.2s ease;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .modal-content i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .modal-content h3 {
            margin-bottom: 0.5rem;
        }

        .modal-content input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin: 1rem 0;
            font-size: 1rem;
            font-family: monospace;
            text-align: center;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            border-left: 4px solid var(--success);
        }

        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        .toast.warning { border-left-color: var(--warning); }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Skeleton Loading */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @media (max-width: 640px) {
            .view-container {
                padding: 1rem;
            }
            
            .setup-card {
                padding: 2rem;
            }
            
            .tiendas-grid {
                grid-template-columns: 1fr;
            }
            
            .tienda-stats {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>

<div class="view-container">
    <header class="view-header" id="gestor-top-bar" style="display: none;">
        <h2><i class="fas fa-tasks"></i> Multi-Gestor</h2>
        <button class="btn-primary" onclick="window.vincularNuevaTienda()">
            <i class="fas fa-plus"></i> Vincular Tienda
        </button>
    </header>

    <div id="gestor-empty-state" class="hero-setup">
        <div class="setup-card">
            <i class="fas fa-store-alt"></i>
            <h3>Consola de Gestión</h3>
            <p>Vincúlate a una tienda usando el código proporcionado por el cliente.</p>
            <button class="btn-primary" style="padding: 1rem 2rem; font-size: 1rem;" onclick="window.vincularNuevaTienda()">
                <i class="fas fa-link"></i> Vincular Mi Primera Tienda
            </button>
        </div>
    </div>

    <main class="tiendas-grid" id="lista-tiendas" style="display: none;">
        <!-- Cards se renderizan dinámicamente -->
    </main>
</div>

<!-- Modal para vincular tienda -->
<div id="vincularModal" class="modal">
    <div class="modal-content">
        <i class="fas fa-key"></i>
        <h3>Vincular Tienda</h3>
        <p>Ingresa el código EasySync que te proporcionó el cliente</p>
        <input type="text" id="codigoVinculacion" placeholder="Ej: EM-1234" autocomplete="off">
        <div class="modal-buttons">
            <button class="btn-secondary" onclick="window.cerrarModalVinculacion()">
                <i class="fas fa-times"></i> Cancelar
            </button>
            <button class="btn-primary" onclick="window.procesarVinculacion()">
                <i class="fas fa-check"></i> Vincular
            </button>
        </div>
    </div>
</div>
