<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasySync - Control de Tienda</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --success: #10b981;
            --success-dark: #059669;
            --danger: #ef4444;
            --danger-dark: #dc2626;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        .view-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            animation: slideDown 0.3s ease;
        }

        .view-header h2 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .view-header i {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Botones */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-secondary:hover {
            background: var(--bg);
            border-color: var(--primary);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger) 0%, var(--danger-dark) 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* Empty State */
        .hero-setup {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s ease;
        }

        .setup-card {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 24px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            max-width: 500px;
        }

        .setup-card i {
            font-size: 4rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .setup-card h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .setup-card p {
            color: var(--text-light);
            margin-bottom: 1.5rem;
        }

        /* Gestor Cards */
        .gestor-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            animation: slideUp 0.3s ease;
        }

        .gestor-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .gestor-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .avatar {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.25rem;
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .gestor-details {
            flex: 1;
        }

        .gestor-name {
            font-size: 1.125rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .edit-name {
            cursor: pointer;
            color: var(--text-light);
            font-size: 0.875rem;
            transition: color 0.2s;
        }

        .edit-name:hover {
            color: var(--primary);
        }

        .gestor-status {
            font-size: 0.75rem;
            margin-top: 0.25rem;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.5rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .status-pending {
            background: #fef3c7;
            color: #d97706;
        }

        .status-active {
            background: #d1fae5;
            color: #059669;
        }

        .codigo-acceso {
            background: #f1f5f9;
            padding: 0.25rem 0.5rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.8rem;
            margin-left: 0.5rem;
        }

        /* Switch Group */
        .switch-group {
            display: grid;
            gap: 0.75rem;
            margin: 1rem 0;
        }

        .switch-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background: var(--bg);
            border-radius: 12px;
            transition: background 0.2s;
        }

        .switch-item:hover {
            background: #f1f5f9;
        }

        .switch-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
        }

        .switch-label i {
            color: var(--text-light);
            width: 20px;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: 0.3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--success);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* Botón revocar */
        .btn-revoke {
            width: 100%;
            background: #fff1f2;
            color: var(--danger);
            border: 1px solid #fee2e2;
            padding: 0.75rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn-revoke:hover {
            background: #ffe4e6;
            border-color: var(--danger);
            transform: translateY(-1px);
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            border-left: 4px solid var(--success);
        }

        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        .toast.warning { border-left-color: var(--warning); }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.2s ease;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .modal-content i {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .modal-content h3 {
            margin-bottom: 0.5rem;
        }

        .modal-content .codigo {
            background: var(--bg);
            padding: 1rem;
            border-radius: 12px;
            font-family: monospace;
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 1rem 0;
            word-break: break-all;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }

        @media (max-width: 640px) {
            .view-container {
                padding: 1rem;
            }
            
            .setup-card {
                padding: 2rem;
            }
            
            .gestor-info {
                flex-direction: column;
                text-align: center;
            }
            
            .gestor-name {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="view-container">
    <header class="view-header" id="sync-top-bar" style="display: none;">
        <h2><i class="fas fa-sync-alt"></i> EasySync</h2>
        <button class="btn-primary" onclick="window.generarCodigoAcceso()">
            <i class="fas fa-plus"></i> Nuevo Acceso
        </button>
    </header>

    <div id="sync-empty-state" class="hero-setup">
        <div class="setup-card">
            <i class="fas fa-network-wired"></i>
            <h3>Sincroniza tu Tienda</h3>
            <p>Genera un código para que un gestor profesional administre tu stock de forma segura.</p>
            <button class="btn-primary" onclick="window.generarCodigoAcceso()">
                <i class="fas fa-key"></i> Generar Llave de Acceso
            </button>
        </div>
    </div>

    <main id="lista-gestores" style="display: none;">
        <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
            <i class="fas fa-users" style="color: var(--primary);"></i>
            Gestores Vinculados
        </h3>
    </main>
</div>

<!-- Modal para mostrar código -->
<div id="codigoModal" class="modal">
    <div class="modal-content">
        <i class="fas fa-key" style="color: var(--success);"></i>
        <h3>Código de Acceso Generado</h3>
        <p>Comparte este código con tu gestor. Expira en <strong>10 minutos</strong>.</p>
        <div class="codigo" id="codigoGenerado"></div>
        <div class="modal-buttons">
            <button class="btn-secondary" onclick="window.copiarCodigo()">
                <i class="fas fa-copy"></i> Copiar
            </button>
            <button class="btn-primary" onclick="window.cerrarModal()">
                <i class="fas fa-check"></i> Entendido
            </button>
        </div>
    </div>
</div>
